# The systemd backend supplies the journal timestamp separately and formats
# hostname/process metadata before MESSAGE. The producer's timestamp remains.
[INCLUDES]
before = common.conf

[Definition]
failregex = ^%(__prefix_line)s[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} SECURITY event=<event> ip=<ADDR>$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=mycount-server.service

[Init]
logtype = journal
event = collection_request

